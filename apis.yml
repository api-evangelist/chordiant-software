name: Chordiant Software
description: Chordiant Software Corporation was an enterprise software vendor founded in 1991 and based in
  California, known for customer relationship management (CRM) and customer decision management software used
  by large banks, insurers, telecommunications carriers, and healthcare organizations. Its products included
  Chordiant Decision Management, Marketing Director, and Recommendation Advisor, delivering real-time
  predictive decisioning and next-best-action recommendations across customer channels. The company went
  public on NASDAQ (CHRD) in 2000 and was acquired by Pegasystems in 2010, with its decisioning technology
  folded into Pega's Customer Decision Hub. Chordiant no longer operates as an independent company and
  exposes no public developer portal or API; the chordiant.com domain now redirects to pega.com. This
  profile is retained as a historical portfolio-lead record and carries no live API surface to enrich.
